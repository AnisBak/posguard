# Sunrise Market demo EBT config. EXAMPLE ONLY, NOT LEGAL GUIDANCE.
# The jurisdiction is fictional. Real eligibility comes from federal SNAP rules,
# your state's restrictions, and your own item catalog. posguard ships no list.
posguard.ebt.jurisdiction=Example State (fictional)

posguard.ebt.category.produce=eligible
posguard.ebt.category.bakery=eligible
posguard.ebt.category.beverages=eligible
posguard.ebt.category.soda=eligible
posguard.ebt.category.hot_food=ineligible
posguard.ebt.category.household=ineligible

# Shows how a state restriction (for example, a waiver) overrides eligibility.
posguard.ebt.restricted=soda

# Chip first; magstripe only after a failed chip attempt.
posguard.ebt.entry.order=chip_insert,chip_tap,magstripe
