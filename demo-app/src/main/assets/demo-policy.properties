# Sunrise Market DEMO policy, loaded with GuardPolicy.fromProperties to show that
# policy is owned by the integrating app. Library defaults (docs/policy-defaults.md)
# are unchanged.
#
# These reasons stay visible as "noted" in the Why-flagged panel, but do not
# interrupt a demo on an emulator, a debug build, or an older device:
posguard.policy.INTEGRITY_UNAVAILABLE=ALLOW
posguard.policy.ROOT_OR_EMULATOR_SUSPECTED=ALLOW
posguard.policy.DEBUGGER_ATTACHED=ALLOW
